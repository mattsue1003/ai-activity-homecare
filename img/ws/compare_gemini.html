<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>撲克牌比大小 - 樂齡認知學習單</title>
<style>
  @page {
    size: A4 portrait;
    margin: 8mm;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background-color: #f0f2f5;
    color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  /* 控制列（列印時隱藏） */
  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    font-size: 22px;
    font-weight: 800;
    padding: 14px 28px;
    border: 3px solid #000000;
    border-radius: 12px;
    cursor: pointer;
    background-color: #ffffff;
    color: #000000;
    box-shadow: 0 4px 0 #000000;
    transition: transform 0.1s;
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #000000;
  }

  .btn-print {
    background-color: #ffe600;
  }

  /* A4 紙張容器：總高度精準控制在 281mm 以內（297mm - 上下各 8mm） */
  .a4-page {
    width: 210mm;
    height: 280mm;
    background-color: #ffffff;
    border: 4px solid #000000;
    padding: 7mm 10mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* 頁首標題區（微調緊湊高度） */
  .header {
    text-align: center;
    border-bottom: 4px solid #000000;
    padding-bottom: 6px;
    margin-bottom: 6px;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .header .instruction {
    font-size: 22px;
    font-weight: 800;
    background-color: #ffffff;
    display: inline-block;
    padding: 2px 12px;
    border: 2.5px solid #000000;
    border-radius: 8px;
  }

  /* 5 題列表容器 */
  .questions-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
  }

  /* 單題列：縮小上下內距，保留充足畫圈左右空間 */
  .question-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 3px solid #000000;
    border-radius: 12px;
    padding: 4px 20px;
    height: 44.5mm;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .q-number {
    font-size: 36px;
    font-weight: 900;
    width: 58px;
    text-align: center;
    border-right: 3px solid #000000;
    padding-right: 12px;
    line-height: 1.2;
  }

  .cards-pair {
    flex: 1;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 12px;
  }

  /* 撲克牌樣式：高度微調為 39mm 讓上下留白足夠長輩畫圈 */
  .poker-card {
    width: 31mm;
    height: 39mm;
    border: 3.5px solid #000000;
    border-radius: 10px;
    background-color: #ffffff;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }

  .card-red {
    color: #d90000;
  }

  .card-black {
    color: #000000;
  }

  /* 左上與右下角標 */
  .corner-top {
    position: absolute;
    top: 3px;
    left: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 0.95;
  }

  .corner-bottom {
    position: absolute;
    bottom: 3px;
    right: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 0.95;
    transform: rotate(180deg);
  }

  .corner-rank {
    font-size: 20px;
    font-weight: 900;
  }

  .corner-suit {
    width: 14px;
    height: 14px;
  }

  /* 中央超大數字與花色組合 */
  .center-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }

  .center-rank {
    font-size: 46px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -1px;
  }

  .center-suit {
    width: 32px;
    height: 32px;
  }

  /* 列印專用規則 */
  @media print {
    body {
      background-color: #ffffff;
      padding: 0;
      margin: 0;
    }

    .controls {
      display: none !important;
    }

    .a4-page {
      width: 100%;
      height: 279mm;
      border: 4px solid #000000;
      padding: 6mm 9mm;
      margin: 0;
      box-shadow: none;
    }

    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="generateWorksheet()">🔄 換一組題目</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
  </div>

  <div class="a4-page">
    <div class="header">
      <h1>撲克牌比大小</h1>
      <div class="instruction">請用筆「圈出數字比較大的那張牌」</div>
    </div>

    <div class="questions-container" id="questionsContainer"></div>
  </div>

<script>
  const RANKS = [
    { label: 'A', value: 1 },
    { label: '2', value: 2 },
    { label: '3', value: 3 },
    { label: '4', value: 4 },
    { label: '5', value: 5 },
    { label: '6', value: 6 },
    { label: '7', value: 7 },
    { label: '8', value: 8 },
    { label: '9', value: 9 },
    { label: '10', value: 10 }
  ];

  const SUITS = [
    {
      name: 'heart',
      colorClass: 'card-red',
      svg: `<svg viewBox="0 0 100 100" fill="#d90000"><path d="M50 88 C20 65 5 48 5 30 C5 15 17 5 30 5 C40 5 47 11 50 18 C53 11 60 5 70 5 C83 5 95 15 95 30 C95 48 80 65 50 88 Z"/></svg>`
    },
    {
      name: 'spade',
      colorClass: 'card-black',
      svg: `<svg viewBox="0 0 100 100" fill="#000000"><path d="M50 6 C22 32 6 48 6 64 C6 77 17 85 29 85 C37 85 43 81 46 76 L41 94 L59 94 L54 76 C57 81 63 85 71 85 C83 85 94 77 94 64 C94 48 78 32 50 6 Z"/></svg>`
    }
  ];

  function createCardHTML(rankObj, suitObj) {
    return `
      <div class="poker-card ${suitObj.colorClass}">
        <div class="corner-top">
          <span class="corner-rank">${rankObj.label}</span>
          <div class="corner-suit">${suitObj.svg}</div>
        </div>
        <div class="center-display">
          <span class="center-rank">${rankObj.label}</span>
          <div class="center-suit">${suitObj.svg}</div>
        </div>
        <div class="corner-bottom">
          <span class="corner-rank">${rankObj.label}</span>
          <div class="corner-suit">${suitObj.svg}</div>
        </div>
      </div>
    `;
  }

  function generateWorksheet() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    const usedPairs = new Set();

    for (let i = 1; i <= 5; i++) {
      let leftRank, rightRank, pairKey;
      do {
        leftRank = RANKS[Math.floor(Math.random() * RANKS.length)];
        rightRank = RANKS[Math.floor(Math.random() * RANKS.length)];
        pairKey = `${leftRank.value}-${rightRank.value}`;
      } while (leftRank.value === rightRank.value || usedPairs.has(pairKey));

      usedPairs.add(pairKey);

      const leftSuit = SUITS[Math.floor(Math.random() * SUITS.length)];
      const rightSuit = SUITS[Math.floor(Math.random() * SUITS.length)];

      const row = document.createElement('div');
      row.className = 'question-row';
      row.innerHTML = `
        <div class="q-number">${i}.</div>
        <div class="cards-pair">
          ${createCardHTML(leftRank, leftSuit)}
          ${createCardHTML(rightRank, rightSuit)}
        </div>
      `;
      container.appendChild(row);
    }
  }

  generateWorksheet();
</script>
</body>
</html>
