<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找一樣的：配對圖片 - 長輩視覺認知A4學習單</title>
  <!-- 載入 Tailwind CSS 進行快速排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入 Noto Sans TC 確保繁體中文粗黑體清晰易讀 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* 全域字體設定：粗黑高對比 */
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #e5e7eb;
      color: #000000;
      margin: 0;
      padding: 0;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 嚴格設定標準 A4 直式尺寸 (210mm x 297mm) */
    .a4-page {
      width: 210mm;
      height: 297mm;
      background-color: #ffffff;
      margin: 20px auto;
      padding: 12mm 14mm;
      box-sizing: border-box;
      border: 3px solid #000000;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* 連接線大黑圓點樣式 */
    .connect-dot {
      width: 22px;
      height: 22px;
      background-color: #000000;
      border-radius: 50%;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 3px #000000;
      flex-shrink: 0;
      z-index: 10;
    }

    /* 圖卡黑色粗框與白底高對比 */
    .item-card {
      border: 3.5px solid #000000;
      border-radius: 16px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
    }

    /* 列印專用媒體查詢：精準填滿單張 A4 紙張並隱藏控制項 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        width: 210mm;
        height: 297mm;
        background-color: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden;
      }

      .no-print {
        display: none !important;
      }

      .a4-page {
        margin: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        border: 3px solid #000000 !important;
        box-shadow: none !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
    }

    /* 螢幕較小時（如手機或平板瀏覽）維持可完整捲動檢視 */
    @media screen and (max-width: 850px) {
      .a4-wrapper {
        overflow-x: auto;
        padding: 10px;
      }
      .a4-page {
        margin: 10px auto;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部操作控制區（列印時自動隱藏） -->
  <header class="no-print bg-slate-900 text-white py-5 px-4 shadow-lg sticky top-0 z-50 border-b-4 border-yellow-400">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="text-center md:text-left">

          📄 長輩高對比認知學習單產生器
        </h2>
        <p class="text-sm md:text-base text-slate-200 mt-1 font-medium">
          💡 提示：建議列印時選擇 <strong class="text-white underline">A4 直式</strong>、邊界設為 <strong class="text-white underline">無（或預設）</strong>，並開啟 <strong class="text-white underline">背景圖形</strong> 以呈現最佳色彩。
        </p>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-4">
        <!-- 換一組順序大按鈕 -->
        <button
          id="shuffleBtn"
          type="button"
          onclick="shuffleWorksheet()"
          class="bg-amber-400 hover:bg-amber-300 active:translate-y-0.5 text-black font-black text-xl md:text-2xl px-6 py-4 rounded-2xl border-4 border-black shadow-md transition cursor-pointer flex items-center gap-2"
        >
          <span class="text-2xl">🔀</span>
          <span>換一組順序</span>
        </button>

        <!-- 列印 / 存成 PDF 大按鈕 -->
        <button
          id="printBtn"
          type="button"
          onclick="printWorksheet()"
          class="bg-emerald-500 hover:bg-emerald-400 active:translate-y-0.5 text-black font-black text-xl md:text-2xl px-6 py-4 rounded-2xl border-4 border-black shadow-md transition cursor-pointer flex items-center gap-2"
        >
          <span class="text-2xl">🖨️</span>
          <span>列印 / 存成 PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- A4 學習單主體容器 -->
  <main class="a4-wrapper">
    <section class="a4-page" id="worksheetPage" aria-label="找一樣的配對圖片學習單">
      
      <!-- 1. 頂部大標題與說明列 -->
      <div class="border-b-4 border-black pb-3 mb-2">
        <h1 class="text-[38px] leading-tight font-black text-center tracking-wider text-black mb-2">
          找一樣的：配對圖片
        </h1>

        <div class="flex items-center justify-between gap-2 pt-1">
          <!-- 操作指引說明 -->
          <div class="bg-yellow-100 border-2 border-black rounded-xl px-3 py-1.5">
            <p class="text-[22px] font-black text-black tracking-wide">
              👉 把一樣的圖片用線連起來
            </p>
          </div>

          <!-- 姓名與日期欄位 -->
          <div class="text-[20px] font-bold text-black whitespace-nowrap">
            <span>姓名：__________</span>
            <span class="ml-3">日期：____/____</span>
          </div>
        </div>
      </div>

      <!-- 2. 左右兩欄配對區（5 列均分填滿 A4 剩餘高度，中間保留充足畫線空間） -->
      <div id="matchingRowsContainer" class="flex-1 flex flex-col justify-between gap-3 py-1">
        <!-- 由 JavaScript 動態渲染 5 列高辨識度圖卡與連接黑圓點 -->
      </div>

    </section>
  </main>

  <script>
    /**

            <!-- 前方白色開關面板 -->

        svg: `
          <svg viewBox="0 0 180 140" class="w-[145px] h-[108px] overflow-visible" aria-hidden="true">

      },
      {
        id: 'teapot',
        name: '茶壺',
        // 台灣傳統泡茶大陶壺：暖橘紅壺身、弧形壺嘴、大提把與圓鈕壺蓋
        svg: `
          <svg viewBox="0 0 180 140" class="w-[145px] h-[108px] overflow-visible" aria-hidden="true">
            <!-- 右側大彎曲壺把 -->
            <path d="M126 54 C156 50 162 96 124 102" fill="none" stroke="#9A3412" stroke-width="11" stroke-linecap="round"/>

            <circle cx="88" cy="86" r="16" fill="#FEF08A" stroke="#000000" stroke-width="3.5"/>

    /**
     * 洗牌演算法（Fisher-Yates Shuffle）
     * @param {Array} array 欲打亂的陣列
     * @returns {Array} 新的隨機排列陣列
     */
    function getShuffledArray(array) {
      const cloned = [...array];
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned;
    }

    /**
     * 產生錯位（Derangement）的右欄順序，確保任何一列都不會出現左右同一張圖水平直線相連
     * 讓長輩能真正練習「斜向觀察與連線」
     * @param {Array} leftItems 已排好的左欄項目陣列
     * @returns {Array} 保證每一列都與左欄不同的右欄項目陣列
     */
    function getDerangedRightItems(leftItems) {
      let rightItems = getShuffledArray(leftItems);
      let attempts = 0;

      // 檢查是否有任何一列左右相同（index 位置 id 相同）
      const hasSameRowMatch = (left, right) => {
        return left.some((item, idx) => item.id === right[idx].id);
      };

      while (hasSameRowMatch(leftItems, rightItems) && attempts < 100) {
        rightItems = getShuffledArray(leftItems);
        attempts++;
      }

      // 極端保底：若仍巧合重疊，直接循環平移一格確保 100% 錯開
      if (hasSameRowMatch(leftItems, rightItems)) {
        rightItems = [...leftItems.slice(1), leftItems[0]];
      }

      return rightItems;
    }

    /**
     * 渲染學習單主體（5 列左右配對圖卡與大黑圓點）
     */
    function renderWorksheet() {
      const container = document.getElementById('matchingRowsContainer');
      if (!container) return;

      // 同時隨機打亂左欄與右欄，並確保左右完全錯開
      const leftColumnItems = getShuffledArray(ITEMS_DATA);
      const rightColumnItems = getDerangedRightItems(leftColumnItems);

      container.innerHTML = '';

      for (let i = 0; i < 5; i++) {
        const leftItem = leftColumnItems[i];
        const rightItem = rightColumnItems[i];

        const rowEl = document.createElement('div');
        // 每一列均分高度（flex-1），左右各佔約 33%，中間保留 34% 寬敞白色畫線空間
        rowEl.className = 'flex-1 flex items-center justify-between w-full min-h-0';

        rowEl.innerHTML = `
          <!-- 左欄圖卡 + 右側連接大黑點 -->
          <div class="w-[33%] h-full flex items-center relative">
            <div class="item-card">
              <div class="flex items-center justify-center flex-1">
                ${leftItem.svg}
              </div>
              <div class="text-[24px] leading-none font-black text-black tracking-widest mt-1">
                ${leftItem.name}
              </div>
            </div>
            <!-- 左欄卡片右側邊緣大黑圓點 -->
            <div class="connect-dot -ml-2.5" title="從這裡畫線"></div>
          </div>

          <!-- 中間充足白色畫線空間（約 34% 寬度） -->
          <div class="w-[34%] h-full" aria-hidden="true"></div>

          <!-- 左側連接大黑點 + 右欄圖卡 -->
          <div class="w-[33%] h-full flex items-center justify-end relative">
            <!-- 右欄卡片左側邊緣大黑圓點 -->
            <div class="connect-dot -mr-2.5" title="連到這裡"></div>
            <div class="item-card">
              <div class="flex items-center justify-center flex-1">
                ${rightItem.svg}
              </div>
              <div class="text-[24px] leading-none font-black text-black tracking-widest mt-1">
                ${rightItem.name}
              </div>
            </div>
          </div>
        `;

        container.appendChild(rowEl);
      }
    }

    /**
     * 點擊「換一組順序」按鈕處理函式
     */
    function shuffleWorksheet() {
      renderWorksheet();
    }

    /**
     * 點擊「列印 / 存成 PDF」按鈕處理函式
     */
    function printWorksheet() {
      window.print();
    }

    // 頁面載入完成後立即產生一組左右錯開的學習單
    window.addEventListener('DOMContentLoaded', () => {
      renderWorksheet();
    });
  </script>
</body>
</html>
